<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="glitch-hover" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="2" dy="1" in="SourceGraphic" result="violet-glitch"/>
      <feColorMatrix in="violet-glitch" type="matrix" values="0 0 0 0 0.545  0 0 0 0 0.36  0 0 0 0 0.965  0 0 0 1 0" result="violet"/>
      <feOffset dx="-2" dy="-1" in="SourceGraphic" result="cyan-glitch"/>
      <feColorMatrix in="cyan-glitch" type="matrix" values="0 0 0 0 0.024  0 0 0 0 0.714  0 0 0 0 0.835  0 0 0 1 0" result="cyan"/>
      <feBlend in="violet" in2="cyan" mode="screen" result="blend"/>
      <feBlend in="SourceGraphic" in2="blend" mode="normal"/>
    </filter>
  </defs>
  
  <g filter="url(#glitch-hover)">
    <!-- A pixel-style hand pointer -->
    <path d="M12,4 h2 v4 h2 v4 h4 v4 h2 v10 h-10 v-2 h-2 v-2 h-2 v-4 h-2 v-10 h4 v-4 z" fill="#06b6d4" opacity="0.4" transform="translate(-1, 0)" />
    <path d="M12,4 h2 v4 h2 v4 h4 v4 h2 v10 h-10 v-2 h-2 v-2 h-2 v-4 h-2 v-10 h4 v-4 z" fill="#8b5cf6" opacity="0.4" transform="translate(1, 0)" />
    <path d="M12,4 h2 v4 h2 v4 h4 v4 h2 v10 h-10 v-2 h-2 v-2 h-2 v-4 h-2 v-10 h4 v-4 z" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linejoin="miter" />
  </g>
</svg>
