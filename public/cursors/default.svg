<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="glitch" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="2" dy="0" in="SourceGraphic" result="red-glitch"/>
      <feColorMatrix in="red-glitch" type="matrix" values="0 0 0 0 0.545  0 0 0 0 0.36  0 0 0 0 0.965  0 0 0 1 0" result="violet"/>
      <feOffset dx="-2" dy="0" in="SourceGraphic" result="blue-glitch"/>
      <feColorMatrix in="blue-glitch" type="matrix" values="0 0 0 0 0.024  0 0 0 0 0.714  0 0 0 0 0.835  0 0 0 1 0" result="cyan"/>
      <feBlend in="violet" in2="cyan" mode="screen" result="blend"/>
      <feBlend in="SourceGraphic" in2="blend" mode="normal"/>
    </filter>
  </defs>
  
  <g filter="url(#glitch)">
    <!-- Base cursor polygon matching a retro pixel arrow -->
    <polygon points="4,4 4,24 10,18 14,27 19,25 15,16 24,16" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linejoin="miter" />
  </g>
</svg>
